{$DEBUGINFO OFF}=Disables the generation of debugging information.
{$DENYPACKAGEUNIT ON}=Prevents the unit from being placed in a package (Delphi compatibility).
{$DENYPACKAGEUNIT OFF}=Allows the unit to be placed in a package (Delphi compatibility).
{$DESCRIPTION |}=Recognized for compatibility and ignored by the compiler.
{$E+}=Enables coprocessor emulation warnings on Intel 80x86.
{$E-}=Disables coprocessor emulation warnings.
{$EXCESSPRECISION ON}=Improves floating point precision on x64 (Delphi compatibility).
{$EXCESSPRECISION OFF}=Disables excess floating point precision on x64 (Delphi compatibility).
{$EXTENSION |}=Sets the extension of the generated binary or library.
{$FRAMEWORKPATH |}=Adds one or more paths to the framework search path (Darwin only).
{$G+}=Enables 80286 code generation (recognized and ignored).
{$G-}=Disables 80286 code generation (recognized and ignored).
{$IMAGEBASE |}=Sets the image base address of a DLL on Windows, e.g. $00400000.
{$INCLUDEPATH |}=Adds one or more paths to the include file search path.
{$LIBPREFIX |}=Sets the prefix of the library file name.
{$LIBRARYPATH |}=Adds one or more paths to the library search path.
{$LIBSUFFIX |}=Sets the suffix of the library file name.
{$MAXSTACKSIZE |}=Sets the maximum stack size in bytes for executables on Windows.
{$M |,}=Sets the stack size and heap size, e.g. {$M 16384,1048576}.
{$MEMORY |,}=Sets the stack size and heap size, e.g. {$MEMORY 16384,1048576}.
{$MINSTACKSIZE |}=Sets the minimum stack size in bytes for executables on Windows.
{$MODE |}=Sets the compiler compatibility mode: FPC, OBJFPC, DELPHI, DELPHIUNICODE, TP, MACPAS, ISO or DEFAULT.
{$MODESWITCH |}=Enables or disables individual mode features, e.g. {$MODESWITCH ADVANCEDRECORDS}.
{$N+}=Enables numeric coprocessor support (recognized and ignored).
{$N-}=Disables numeric coprocessor support (recognized and ignored).
{$NAMESPACE |}=Sets the default namespace prefix for unit names (Delphi compatibility).
{$O+}=Enables level 2 optimizations.
{$O-}=Disables all optimizations.
{$OBJECTPATH |}=Adds one or more paths to the object file search path.
{$P+}=All parameters of type string are treated as open string parameters.
{$P-}=Parameters of type string are treated as normal string parameters.
{$OPENSTRINGS ON}=All parameters of type string are treated as open string parameters.
{$OPENSTRINGS OFF}=Parameters of type string are treated as normal string parameters.
{$PASCALMAINNAME |}=Sets the assembler symbol name of the program or library entry point.
{$PIC ON}=Enables generation of position independent code.
{$PIC OFF}=Disables generation of position independent code.
{$POINTERMATH ON}=Enables pointer arithmetic.
{$POINTERMATH OFF}=Disables pointer arithmetic.
{$PROFILE ON}=Enables the generation of profiling code (program source only).
{$PROFILE OFF}=Disables the generation of profiling code.
{$SCREENNAME |}=Sets the screen name (Netware only).
{$SETPEFLAGS |}=Sets the flags written to the PE header on Windows.
{$SETPEOSVERSION |}=Sets the operating system version in the PE header (Windows).
{$SETPESUBSYSVERSION |}=Sets the subsystem version in the PE header (Windows).
{$SETPEUSERVERSION |}=Sets the user version in the PE header (Windows).
{$SMARTLINK ON}=Compiles the unit so that it can be used for smart linking.
{$SMARTLINK OFF}=Disables smart linking of the unit.
{$SYSCALL ON}=Selects the system calling convention (Amiga/MorphOS only).
{$SYSCALL OFF}=Deselects the system calling convention (Amiga/MorphOS only).
{$THREADNAME |}=Sets the thread name (Netware only).
{$UNITPATH |}=Adds one or more paths to the unit search path.
{$VARPROPSETTER ON}=Allows var, out and constref parameters for property setters.
{$VARPROPSETTER OFF}=Disallows var, out and constref parameters for property setters.
{$VERSION |}=Sets the version number of a DLL on Windows, e.g. 1.2.3.
{$WEAKPACKAGEUNIT ON}=Parsed for Delphi compatibility and otherwise ignored.
{$X+}=Enables extended syntax.
{$X-}=Disables extended syntax.
{$EXTENDEDSYNTAX ON}=Enables extended syntax.
{$EXTENDEDSYNTAX OFF}=Disables extended syntax.
{$Y+}=Enables generation of browser information (recognized and ignored).
{$Y-}=Disables generation of browser information (recognized and ignored).
{$REFERENCEINFO ON}=Enables generation of browser information (recognized and ignored).
{$REFERENCEINFO OFF}=Disables generation of browser information (recognized and ignored).
{$ZEROBASEDSTRINGS ON}=Changes local string indexing to 0-based (Delphi compatibility).
{$ZEROBASEDSTRINGS OFF}=Keeps local string indexing 1-based (Delphi compatibility).

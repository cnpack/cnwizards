Version=1.8.1.1372
NewFeature=1
BigBugFixed=1
BetaVersion=0

Comment=+ 支持 RAD Studio 13.2。\n+ 代码格式化增加对 C/C++ 的支持。\n+ ImageList 编辑器增加 Iconify 的 SVG 图片提供商。\n+ 编码工具集增加书签跳转工具。\n+ 窗体转换工具增加文件编码与换行转换的功能。\n* 版本扩展中的版本号支持进位。\n* 完善 IDE 汉化界面。\n- 去除鸡肋的 CnHash 命令行，仅保留杂凑值。\n* 其他错误修正与改进。

Comment_CHT=+ 支持 RAD Studio 13.2。\n+ 代碼格式化增加對 C/C++ 的支持。\n+ ImageList 編輯器增加 Iconify 的 SVG 圖片提供商。\n+ 編碼工具集增加書籤跳轉工具。\n+ 窗體轉換工具增加文件編碼與換行轉換的功能。\n* 版本擴展中的版本號支持進位。\n* 完善 IDE 漢化界面。\n- 去除雞肋的 CnHash 命令行，僅保留雜湊值。\n* 其他錯誤修正與改進。

Comment_ENU=+ Supports RAD Studio 13.2.\n+ Code Formatter Supports C/C++.\n+ Add Iconify as an SVG Image Provider for ImageList Editor.\n+ Add a Bookmark Jumping Tool in Coding Toolset.\n+ The Form Conversion Tool Supports File Encoding and Line Ending Conversion.\n* Version Mumbers Support Carrying Over.\n* Improved IDE Translations.\n- Removed Rarely Useful CnHash Command Line, Keeping Only Hash Values.\n* Other Bugs Fixed.


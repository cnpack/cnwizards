Version=1.8.1.1372
NewFeature=1
BigBugFixed=1
BetaVersion=0

Comment=* 修正退出 IDE 时可能卡死的问题。\n* C/C++ 代码格式化优化对换行的支持。\n* 代码嵌入功能在未选择时仍允许插入条目。\n* 完善 IDE 汉化界面。\n* 窗体转换工具的文件编码转换功能增加 BOM 选项。\n* 调试信息查看器修正一处 CnDebug 与 OutputDebugString 同时工作时可能产生的竞争问题。\n* 其他错误修正与改进。

Comment_CHT=* 修正退出 IDE 時可能卡死的問題。\n* C/C++ 代碼格式化優化對換行的支持。\n* 代碼嵌入功能在未選擇時仍允許插入條目。\n* 完善 IDE 漢化界面。\n* 窗體轉換工具的文件編碼轉換功能增加 BOM 選項。\n* 調試信息查看器修正一處 CnDebug 與 OutputDebugString 同時工作時可能產生的競爭問題。\n* 其他錯誤修正與改進。

Comment_ENU=* Fix an IDE Hang Problem when Exiting.\n* Optimized C/C++ Code Formatting Support For Line Breaks.\n* Code Embedding Feature Now Allows Inserting Items Even When No Selection.\n* Improve IDE Chinese Translations.\n* Add a BOM Option to File Encoding Conversion Feature in  Form Conversion Tool.\n* Fixed a Potential Race Condition in CnDebugViewer when CnDebug And OutputDebugString are Active Simultaneously.\n* Other Bugs Fixed.

